    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>Sidebar Only</title>
    <style>
        body {
        margin: 0;
        font-family: Arial, sans-serif;
        }
        #menu-toggle { display: none; }

        .menu-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        width: 46px;
        height: 46px;
        background: #003d7a;
        color: white;
        font-size: 22px;
        position: fixed;
        top: 20px;
        left: 0;
        z-index: 900;
        border-radius: 0 8px 8px 0;
        box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
        transition: left 0.32s ease, background 0.2s;
        user-select: none;
        }
        .menu-icon:hover { background: #005ec4; }

        #menu-toggle:checked ~ .menu-icon { left: 240px; }

        .sidebar {
        position: fixed;
        top: 0;
        left: -240px;
        width: 240px;
        height: 100%;
        background: linear-gradient(180deg, #002f6c 0%, #004aab 100%);
        transition: left 0.32s ease;
        padding-top: 60px;
        z-index: 800;
        box-shadow: 4px 0 20px rgba(0,0,0,0.15);
        }
        #menu-toggle:checked ~ .sidebar { left: 0; }

        .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        .sidebar-title { color: #fff; font-size: 15px; font-weight: 600; }

        .close-btn {
        display: block;
        color: rgba(255,255,255,0.8);
        font-size: 20px;
        cursor: pointer;
        padding: 2px 8px;
        border-radius: 4px;
        transition: background 0.2s;
        }
        .close-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }

        .sidebar a {
        display: block;
        padding: 13px 24px;
        color: rgba(255,255,255,0.85);
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        border-left: 3px solid transparent;
        transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .sidebar a:hover {
        background: rgba(255,255,255,0.1);
        border-left-color: #7eb8ff;
        color: #fff;
        }
    </style>
    </head>
    <body>

    <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="menu-icon">☰</label>

    <div class="sidebar">
        <div class="sidebar-header">
        <span class="sidebar-title">Menu</span>
        <label for="menu-toggle" class="close-btn">✕</label>
        </div>
        <a href="#home">🏠 Home</a>
        <a href="#services">⚙️ Services</a>
        <a href="#about">ℹ️ About</a>
        <a href="#contact">📞 Contact</a>
    </div>

    </body>
    </html>
