<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Header Only</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', Arial, sans-serif;
    }

    /* ===== Header ===== */
    .header {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(90deg, #003d7a 0%, #005ec4 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1000;
      box-shadow: 0 3px 16px rgba(0,62,150,0.22);
    }

    .logo-image {
      width: 150px;
      height: 62px;
      object-fit: contain;
    }

    .search-bar {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 0 30px;
    }

    .search-bar input {
      width: 42%;
      padding: 9px 18px;
      border-radius: 25px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border 0.2s, background 0.2s;
    }

    .search-bar input::placeholder { color: rgba(255,255,255,0.65); }
    .search-bar input:focus {
      border-color: #fff;
      background: rgba(255,255,255,0.25);
    }

    .nav-links { display: flex; gap: 10px; }
    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 7px 16px;
      border-radius: 20px;
      border: 1.5px solid rgba(255,255,255,0.35);
      transition: background 0.2s;
    }
    .nav-links a:hover {
      background: rgba(255,255,255,0.18);
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <img class="logo-image"
      src="C:/Users/peter/OneDrive/Desktop/Copilot_20260427_191129.png"
      alt="spekzone logo"/>

    <div class="search-bar">
      <input type="text" placeholder="Search...">
    </div>

    <nav class="nav-links">
      <a href="#home">Home</a>
      <a href="#services">Services</a>
      <a href="#about">About</a>
    </nav>
  </div>

</body>
</html>
