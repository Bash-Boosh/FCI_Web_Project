<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SpekZone – Sign In</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(135deg, #e8f0fe 0%, #f5f8ff 60%, #dce8fb 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(90deg, #003d7a 0%, #005ec4 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1000;
      box-shadow: 0 3px 16px rgba(0,62,150,0.22);
    }

    .logo-image {
      width: 150px;
      height: 62px;
      object-fit: contain;
    }

    .search-bar {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 0 30px;
    }

    .search-bar input {
      width: 42%;
      padding: 9px 18px;
      border-radius: 25px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border 0.2s, background 0.2s;
    }

    .search-bar input::placeholder { color: rgba(255,255,255,0.65); }
    .search-bar input:focus {
      border-color: #fff;
      background: rgba(255,255,255,0.25);
    }

    .nav-links { display: flex; gap: 10px; }
    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 7px 16px;
      border-radius: 20px;
      border: 1.5px solid rgba(255,255,255,0.35);
      transition: background 0.2s;
    }
    .nav-links a:hover {
      background: rgba(255,255,255,0.18);
      color: #fff;
    }

    #menu-toggle { display: none; }
    .menu-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      width: 46px;
      height: 46px;
      background: #003d7a;
      color: white;
      font-size: 22px;
      position: fixed;
      top: 90px;
      left: 0;
      z-index: 900;
      border-radius: 0 8px 8px 0;
      box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
      transition: left 0.32s ease, background 0.2s;
      user-select: none;
    }
    .menu-icon:hover { background: #005ec4; }
    #menu-toggle:checked ~ .menu-icon { left: 240px; }

    .sidebar {
      position: fixed;
      top: 0;
      left: -240px;
      width: 240px;
      height: 100%;
      background: linear-gradient(180deg, #002f6c 0%, #004aab 100%);
      transition: left 0.32s ease;
      padding-top: 80px;
      z-index: 800;
      box-shadow: 4px 0 20px rgba(0,0,0,0.15);
    }
    #menu-toggle:checked ~ .sidebar { left: 0; }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .sidebar-title { color: #fff; font-size: 15px; font-weight: 600; }
    .close-btn {
      display: block;
      color: rgba(255,255,255,0.8);
      font-size: 20px;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .close-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }

    .sidebar a {
      display: block;
      padding: 13px 24px;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      border-left: 3px solid transparent;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .sidebar a:hover {
      background: rgba(255,255,255,0.1);
      border-left-color: #7eb8ff;
      color: #fff;
    }

    .page-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 110px 20px 40px;
    }

    .signin-card {
      width: 370px;
      background: #fff;
      border-radius: 24px;
      padding: 36px 32px 28px;
      box-shadow: 0 12px 48px rgba(0,62,150,0.13), 0 2px 8px rgba(0,0,0,0.05);
      animation: fadeUp 0.45s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .signin-card img {
      display: block;
      max-width: 175px;
      height: auto;
      margin: 0 auto 18px;
    }
    .signin-card h1 {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      color: #002f6c;
      margin-bottom: 22px;
    }

    .form-floating > .form-control {
      font-size: 14px;
      border: 1.5px solid #cdd8f0;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-floating > .form-control:focus {
      border-color: #005ec4;
      box-shadow: 0 0 0 3px rgba(0,94,196,0.1);
    }
    .form-floating > label {
      font-size: 14px;
      color: #6b7fa3;
    }

    .stacked .form-floating:first-child .form-control {
      border-radius: 10px 10px 0 0;
      border-bottom: none;
    }
    .stacked .form-floating:last-child .form-control {
      border-radius: 0 0 10px 10px;
      margin-bottom: 16px;
    }

    .form-check-input:checked {
      background-color: #005ec4;
      border-color: #005ec4;
    }
    .form-check-label { font-size: 14px; color: #4a5a7a; }

    .btn-signin {
      width: 100%;
      padding: 11px;
      background: linear-gradient(90deg, #003d7a, #005ec4);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      margin-top: 4px;
    }
    .btn-signin:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    

    .footer-text {
      margin-top: 22px;
      font-size: 12px;
      color: #9aaac5;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="header">
    <img class="logo-image"
      src="C:/Users/peter/OneDrive/Desktop/Copilot_20260427_191129.png"
      alt="spekzone logo"/>

    <div class="search-bar">
      <input type="text" placeholder="Search...">
    </div>

    <nav class="nav-links">
      <a href="#home">Home</a>
      <a href="#services">Services</a>
      <a href="#about">About</a>
    </nav>
  </div>

  <input type="checkbox" id="menu-toggle">
  <label for="menu-toggle" class="menu-icon">☰</label>

  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Menu</span>
      <label for="menu-toggle" class="close-btn">✕</label>
    </div>
    <a href="#home">🏠 Home</a>
    <a href="#services">⚙️ Services</a>
    <a href="#about">ℹ️ About</a>
    <a href="#contact">📞 Contact</a>
  </div>

  <div class="page-content">
    <div class="signin-card">
      <img
        src="C:/Users/peter/Downloads/Copilot_20260427_191129.png"
        alt="spekzone logo"
      />
      <h1>Sign in</h1>

      <div class="stacked mb-2">
        <div class="form-floating">
          <input type="email" class="form-control" id="floatingInput" placeholder="name@gmail.com"/>
          <label for="floatingInput">Email address</label>
        </div>
        <div class="form-floating">
          <input type="password" class="form-control" id="floatingPassword" placeholder="Password"/>
          <label for="floatingPassword">Password</label>
        </div>
      </div>

      <div class="form-check text-start mb-3">
        <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault"/>
        <label class="form-check-label" for="checkDefault">Remember me</label>
      </div>

      <button class="btn-signin" type="submit">
        Sign in
      </button>

      <p class="footer-text">&copy; copyright 2025–2026</p>
    </div>
  </div>

</body>
</html>
